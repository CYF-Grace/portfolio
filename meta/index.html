<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta | Yifei Chen</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>

<body>
    <h1>Meta</h1>
    <p>This page shows statistics about the code and commit history of my portfolio website.</p>

    <label for="commit-progress">
        Show commits until:
        <input id="commit-progress" type="range" min="0" max="100" value="100">
        <time id="commit-time"></time>
    </label>

    <div id="stats"></div>

    <div id="scrolly-1">
        <div id="scatter-story"></div>

        <div id="scatter-plot">
            <h2>Commits by time of day</h2>
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a id="commit-link" href="" target="_blank" rel="noopener noreferrer"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-tooltip-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>
    </dl>

    <section id="scrolly-2" aria-labelledby="file-story-title">
        <div id="file-story"></div>

        <div id="file-plot">
            <h2 id="file-story-title">Lines by file</h2>
            <dl id="files"></dl>
        </div>
    </section>
</body>

</html>
